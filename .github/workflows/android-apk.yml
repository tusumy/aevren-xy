name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'native-bridge.js'
      - 'proxy-layer.js'
      - 'index.html'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing identity
        uses: actions/cache@v4
        with:
          path: .android
          key: aevren-xy-android-user-home-v1

      - name: Bundle offline Chinese speech model
        run: |
          mkdir -p android/app/src/main/assets
          curl --fail --location --retry 3 --connect-timeout 30 \
            'https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip' \
            --output android/app/src/main/assets/vosk-small-cn.zip
          unzip -tqq android/app/src/main/assets/vosk-small-cn.zip
          test "$(stat -c%s android/app/src/main/assets/vosk-small-cn.zip)" -gt 30000000

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Verify APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aevren-xy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'native-bridge.js'
      - 'proxy-layer.js'
      - 'index.html'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Keep one debug signing identity across ephemeral GitHub runners.
      # The first run creates ~/.android/debug.keystore; later runs restore it,
      # so new APKs can update the previous build instead of conflicting.
      - name: Restore debug signing key
        id: debug-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aevren-xy-debug-keystore-v1

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Verify debug signing key exists
        run: test -f "$HOME/.android/debug.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: aevren-xy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

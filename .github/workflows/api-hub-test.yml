name: API Hub Checks

on:
  pull_request:
    paths:
      - 'api-hub.js'
      - 'api-hub.css'
      - 'api-compat.js'
      - 'app.js'
      - 'index.html'
      - 'pearl-home.js'
      - 'pearl-home.css'
      - 'pearl-florals.svg'
      - 'tests/pearl-home.test.cjs'
      - 'font-import.js'
      - 'font-import.css'
      - 'tests/font-import.test.cjs'
      - 'theme-core.js'
      - 'theme-apple-glass.css'
      - 'theme-sections.js'
      - 'theme-sections.css'
      - 'tests/theme-sections.test.cjs'
      - 'proxy-layer.js'
      - 'tests/api-hub.test.cjs'
      - 'font-import.js'
      - 'font-import.css'
      - 'tests/font-import.test.cjs'
      - 'settings-ui.js'
      - 'creation-group.js'
      - 'creation-corner.css'
      - 'message-actions.js'
      - 'quote-favorites.js'
      - 'quote-favorites.css'
      - 'tool-hub.js'
      - 'sidebar-refine.css'
      - 'tests/role-group-favorites.test.cjs'
      - 'call-core.css'
      - 'call-core.js'
      - 'tests/call-design.test.cjs'
      - 'tests/call-stt-recovery.test.cjs'
      - '.github/workflows/api-hub-test.yml'
  push:
    branches: [main]
    paths:
      - 'api-hub.js'
      - 'api-compat.js'
      - 'app.js'
      - 'proxy-layer.js'
      - 'tests/api-hub.test.cjs'
      - 'font-import.js'
      - 'font-import.css'
      - 'tests/font-import.test.cjs'
      - 'theme-core.js'
      - 'theme-apple-glass.css'
      - 'theme-sections.js'
      - 'theme-sections.css'
      - 'tests/theme-sections.test.cjs'
      - 'settings-ui.js'
      - 'creation-group.js'
      - 'creation-corner.css'
      - 'message-actions.js'
      - 'quote-favorites.js'
      - 'quote-favorites.css'
      - 'tool-hub.js'
      - 'sidebar-refine.css'
      - 'tests/role-group-favorites.test.cjs'
      - 'call-core.css'
      - 'call-core.js'
      - 'tests/call-design.test.cjs'
      - 'tests/call-stt-recovery.test.cjs'
      - '.github/workflows/api-hub-test.yml'

permissions:
  contents: read

jobs:
  api-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check api-hub.js
          node --check pearl-home.js
          node --check theme-sections.js
          node --check theme-core.js
          node --check font-import.js
          node --check settings-ui.js
          node --check creation-group.js
          node --check quote-favorites.js
          node --check call-core.js
          node --check message-actions.js
          node --check api-compat.js
          node --check app.js
          node --check proxy-layer.js
      - name: Route regression tests
        run: node --test tests/api-hub.test.cjs tests/pearl-home.test.cjs tests/theme-sections.test.cjs tests/font-import.test.cjs tests/role-group-favorites.test.cjs tests/call-design.test.cjs tests/call-stt-recovery.test.cjs

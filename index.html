  <div class="app">
    <aside class="sidebar" id="sidebar"><button class="sidebar-close" id="sidebarClose" type="button" aria-label="关闭菜单"><span></span><span></span></button>
      <div class="brand"><div class="brand-mark">砚</div><div><strong>砚屿</strong><span>Aevren · XY</span></div></div>
      <button class="new-chat" id="newChat">＋ 新对话</button>
      <div class="section-label">最近</div>
      <nav class="chats" id="chatList"></nav>
      <div class="sidebar-bottom">
        <input class="sidebar-toolbox-toggle" id="sidebarToolboxToggle" type="checkbox" />
        <label class="sidebar-toolbox-label" for="sidebarToolboxToggle"><span>工具</span><span class="sidebar-toolbox-chevron">⌄</span></label>
        <button class="nav-btn" data-panel="memory">⌁ <span>记忆</span><b id="memoryCount">0</b></button>
        <button class="nav-btn" data-panel="characters">◇ <span>角色</span></button>
        <button class="nav-btn" data-panel="theme">◐ <span>主题</span></button>
        <button class="nav-btn" data-panel="journal">◌ <span>日记</span></button>
        <button class="nav-btn" data-panel="data">▤ <span>数据管理</span></button>
        <button class="nav-btn" data-panel="mcp">⌘ <span>MCP</span></button>
        <button class="nav-btn" data-panel="settings">⚙ <span>设置</span></button>
      </div>
    </aside>
    <main class="main">
      <header>
        <button class="icon-btn mobile-only" id="menuBtn">☰</button>
        <div class="presence"><i></i><div><strong>玄砚</strong><span>online · just for you</span></div></div>
        <button class="icon-btn" id="memoryBtn" title="接口设置" aria-label="接口设置">⚙</button>
      </header>
      <section class="messages" id="messages"></section>
      <div class="composer-wrap">
        <div class="composer">
          <button class="attach" title="附件">＋</button>
          <textarea id="input" rows="1" placeholder="想和玄砚说什么…"></textarea>
          <button class="send" id="sendBtn" aria-label="发送">↑</button>
        </div>
        <small><span>AEVREN · XY</span>　 Enter 发送 · Shift + Enter 换行</small>
      </div>
    </main>
    <aside class="panel" id="panel">
      <div class="panel-head"><div><span id="panelEyebrow">MEMORY</span><h2 id="panelTitle">记忆</h2></div><button class="icon-btn" id="closePanel">×</button></div>
      <div id="panelBody"></div>
    </aside>
    <div class="scrim" id="scrim"></div>

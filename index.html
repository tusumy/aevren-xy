  <div class="app">
    <aside class="sidebar" id="sidebar"><button class="sidebar-close" id="sidebarClose" type="button" aria-label="关闭菜单"><span></span><span></span></button>
      <div class="brand"><div class="brand-mark">砚</div><div><strong>砚屿</strong><span>Aevren · XY</span></div></div>
      <button class="new-chat" id="newChat">＋ 新对话</button>
      <div class="xy-conv-search" role="search" aria-label="搜索对话标题">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.6" cy="10.6" r="6.7"/><path d="m15.8 15.8 4.9 4.9"/></svg>
        <input type="search" id="xyConversationSearch" autocomplete="off" placeholder="寻找一段对话…" aria-label="按标题搜索对话">
        <button type="button" id="xyConversationSearchClear" aria-label="清除搜索" title="清除搜索" hidden>×</button>
      </div>
      <div class="section-label xy-chat-section-label"><span>最近</span><small id="xyChatSearchSummary" role="status"></small></div>
      <nav class="chats" id="chatList"></nav>
      <div class="xy-conv-empty" id="xyConversationSearchEmpty" hidden>
        <span class="xy-conv-empty-art" aria-hidden="true"></span>
        <strong>还没找到这段对话</strong>
        <p>换个标题关键词试试。</p>
      </div>
      <div class="sidebar-bottom">
        <div class="xy-sidebar-tools-row">
          <button class="nav-btn xy-tools-entry" type="button" data-panel="toolhub"><span class="xy-tools-symbol" aria-hidden="true">✦</span><span class="xy-tools-copy">工具中心<small>整理所有功能</small></span><span class="xy-tools-chevron" aria-hidden="true">↗</span></button>
          <button class="xy-sidebar-fav-toggle" id="xySidebarFavToggle" type="button" aria-label="展开或收起已收藏工具" aria-expanded="false"><span class="xy-sidebar-fav-label"><span aria-hidden="true">★</span><span>收藏</span></span><span class="xy-sidebar-fav-right"><b id="xySidebarFavCount" aria-label="收藏数量">0</b><i aria-hidden="true">⌄</i></span></button>
        </div>
        <nav id="xySidebarFavorites" class="xy-sidebar-favorites" aria-label="已收藏的工具" hidden></nav>
        <!-- Legacy memory counter remains hidden for existing chat renderers. -->
        <span id="memoryCount" hidden>0</span>
      </div>
    </aside>
    <main class="main">
      <header>
        <button class="icon-btn mobile-only" id="menuBtn">☰</button>
        <div class="presence"><i></i><div><strong>玄砚</strong><span>online · just for you</span></div></div>
        <button class="icon-btn" id="memoryBtn" title="接口设置" aria-label="接口设置">⚙</button>
      </header>
      <section class="messages" id="messages"></section>
      <div class="composer-wrap">
        <div class="composer">
          <button class="attach" title="附件">＋</button>
          <textarea id="input" rows="1" placeholder="想和玄砚说什么…"></textarea>
          <button class="send" id="sendBtn" aria-label="发送">↑</button>
        </div>
        <small><span>AEVREN · XY</span>　 Enter 发送 · Shift + Enter 换行</small>
      </div>
    </main>
    <aside class="panel" id="panel">
      <div class="panel-head"><div><span id="panelEyebrow">MEMORY</span><h2 id="panelTitle">记忆</h2></div><button class="icon-btn" id="closePanel">×</button></div>
      <div id="panelBody"></div>
    </aside>
